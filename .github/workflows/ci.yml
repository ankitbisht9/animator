name: ci

on:
  push:
  pull_request:

# The whole suite runs offline: no LLM API keys, recorded fixtures only.
env:
  OPENAI_API_KEY: ""

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Setup
        run: make setup
      - name: Playwright system deps
        run: uv run playwright install-deps chromium
      - name: Lint
        run: make lint
      - name: Codegen drift
        run: make check-codegen
      - name: Tests
        run: make test

  # The pinned export environment (docker/export.Dockerfile, ADR-026): Linux golden
  # frames and export determinism are enforced here, with the network switched off.
  export-env:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the export image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/export.Dockerfile
          tags: animator-export:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Offline tests inside the image
        run: docker run --rm --network none --shm-size=2g animator-export:local python -m pytest -m "not live"
