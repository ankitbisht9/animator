  <circle data-part="electrons" cx="286.1" cy="73.9" r="11" data-fill="blue" data-stroke="blue.dark" stroke-width="2"/>
  <circle data-anchor="nucleus" cx="180" cy="180" r="1"/>
  <circle data-anchor="shells" cx="286" cy="286" r="1"/>
</svg>
