  <circle data-part="protons" cx="206" cy="182" r="13" data-fill="red" data-stroke="red.dark" stroke-width="2"/>
  <circle data-part="neutrons" cx="170" cy="154" r="13" data-fill="gray" data-stroke="gray.dark" stroke-width="2"/>
  <circle data-part="protons" cx="192" cy="206" r="13" data-fill="red" data-stroke="red.dark" stroke-width="2"/>
  <circle data-part="neutrons" cx="204" cy="162" r="13" data-fill="gray" data-stroke="gray.dark" stroke-width="2"/>
  <circle data-part="electrons" cx="180.0" cy="260.0" r="11" data-fill="blue" data-stroke="blue.dark" stroke-width="2"/>
