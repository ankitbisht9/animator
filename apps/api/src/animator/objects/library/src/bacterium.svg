  <g data-part="pili" fill="none" data-stroke="pink.dark" stroke-width="2.5">
    <path d="M80 36 L72 18"/><path d="M130 30 L128 10"/><path d="M190 28 L194 8"/><path d="M250 30 L256 10"/>
    <path d="M310 36 L320 18"/><path d="M90 184 L82 202"/><path d="M160 190 L158 210"/><path d="M230 192 L234 212"/>
