  <rect data-part="cytoplasm" x="34" y="42" width="332" height="136" rx="68" data-fill="pink.light" stroke-width="0" opacity="0.55"/>
  <rect data-part="cell_wall" x="34" y="42" width="332" height="136" rx="68" fill="none" data-stroke="pink.dark" stroke-width="6"/>
