<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250">
  <!-- A chloroplast cut lengthwise: membranes, stroma, grana (stacks of thylakoids) joined by lamellae. -->
  <path data-part="outer_membrane" d="M30 125 C30 60 120 18 220 18 C320 18 410 60 410 125 C410 190 320 232 220 232 C120 232 30 190 30 125 Z" data-fill="green" data-stroke="green.dark" stroke-width="3"/>
  <path data-part="stroma" d="M46 125 C46 72 130 34 220 34 C310 34 394 72 394 125 C394 178 310 216 220 216 C130 216 46 178 46 125 Z" data-fill="green.soft" stroke-width="0"/>
  <path data-part="inner_membrane" d="M46 125 C46 72 130 34 220 34 C310 34 394 72 394 125 C394 178 310 216 220 216 C130 216 46 178 46 125 Z" fill="none" data-stroke="green.dark" stroke-width="4"/>
  <!-- Lamellae: membranes joining the stacks -->
  <g data-part="lamellae" fill="none" data-stroke="green" stroke-width="3">
    <path d="M86 112 C110 100 130 100 150 108"/>
    <path d="M86 140 C110 152 130 152 150 144"/>
    <path d="M178 96 C196 84 216 84 232 92"/>
    <path d="M178 150 C196 164 216 166 232 158"/>
    <path d="M262 108 C282 98 300 98 318 106"/>
    <path d="M262 142 C282 152 300 152 318 146"/>
    <path d="M150 126 L178 124"/>
    <path d="M232 126 L262 126"/>
  </g>
  <!-- Grana: stacks of thylakoid discs -->
  <g data-part="grana" data-fill="green" data-stroke="green.dark" stroke-width="2">
    <rect x="62" y="100" width="40" height="10" rx="5"/><rect x="62" y="112" width="40" height="10" rx="5"/>
    <rect x="62" y="124" width="40" height="10" rx="5"/><rect x="62" y="136" width="40" height="10" rx="5"/>
    <rect x="140" y="88" width="42" height="10" rx="5"/><rect x="140" y="100" width="42" height="10" rx="5"/>
    <rect x="140" y="112" width="42" height="10" rx="5"/><rect x="140" y="124" width="42" height="10" rx="5"/>
    <rect x="140" y="136" width="42" height="10" rx="5"/><rect x="140" y="148" width="42" height="10" rx="5"/>
    <rect x="226" y="76" width="42" height="10" rx="5"/><rect x="226" y="88" width="42" height="10" rx="5"/>
    <rect x="226" y="100" width="42" height="10" rx="5"/><rect x="226" y="112" width="42" height="10" rx="5"/>
    <rect x="226" y="124" width="42" height="10" rx="5"/><rect x="226" y="136" width="42" height="10" rx="5"/>
    <rect x="226" y="148" width="42" height="10" rx="5"/><rect x="226" y="160" width="42" height="10" rx="5"/>
    <rect x="312" y="98" width="42" height="10" rx="5"/><rect x="312" y="110" width="42" height="10" rx="5"/>
    <rect x="312" y="122" width="42" height="10" rx="5"/><rect x="312" y="134" width="42" height="10" rx="5"/>
    <rect x="312" y="146" width="42" height="10" rx="5"/>
  </g>
  <!-- A starch grain and ribosomes in the stroma -->
  <ellipse data-part="starch_grain" cx="196" cy="186" rx="20" ry="10" data-fill="#f6f2ea" data-stroke="gray" stroke-width="2"/>
  <g data-part="ribosomes" data-fill="green.dark" stroke-width="0">
    <circle cx="118" cy="70" r="3"/><circle cx="300" cy="66" r="3"/><circle cx="118" cy="182" r="3"/>
    <circle cx="290" cy="186" r="3"/><circle cx="364" cy="78" r="3"/><circle cx="352" cy="176" r="3"/>
    <circle cx="200" cy="58" r="3"/>
  </g>
  <path d="M84 72 C118 50 166 40 214 40" fill="none" data-stroke="#ffffff" stroke="#ffffff" stroke-width="6" opacity="0.4"/>
</svg>
