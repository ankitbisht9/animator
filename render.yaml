      - key: LLM_BUDGET_TOKENS_PER_GENERATION
        value: "2000000"
      - key: LLM_BUDGET_USD_PER_GENERATION
        value: "5.00"
      - key: LLM_MAX_CONCURRENCY
        value: "16"
      - key: OPENAI_MAX_RETRIES
        value: "4"
      - key: OPENAI_SERVICE_TIER
        value: priority
      - key: OPENAI_STORE
        value: "false"
      - key: OPENAI_TIMEOUT_S
        value: "120"

      # The voice: ElevenLabs, as on the development machine (.env).
      - key: ANIMATOR_TTS_ENABLED
        value: "1"
      - key: ANIMATOR_TTS_PROVIDER
        value: elevenlabs
      - key: ANIMATOR_TTS_MODEL
        value: eleven_v4
