[project]
name = "animator-contracts"
version = "0.1.0"
description = "GENERATED Pydantic models for the engine worker protocol. Do not edit; run `make codegen`."
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animator_contracts"]
